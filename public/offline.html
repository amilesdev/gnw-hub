<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · GNW Hub</title>
    <style>
      /* AU-6: the 3a tokens, inline (this page has no CSS bundle). */
      :root {
        color-scheme: light dark;
        --app: #faf7f2; --ink: #1c1a17; --ink-soft: #625d55; --glow-top: #eef0e3;
        --accent: #5e7048; --accent-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --app: #161410; --ink: #f1ece4; --ink-soft: #b3ac9f; --glow-top: #1b1d16;
          --accent: #aebe8a; --accent-fg: #1c2410;
        }
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1rem; padding: max(env(safe-area-inset-top), 2rem) 2rem max(env(safe-area-inset-bottom), 2rem);
        background: linear-gradient(180deg, var(--glow-top), var(--app) 96px) var(--app);
        color: var(--ink); text-align: center;
        font-family: 'Albert Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      img { width: 88px; height: 88px; border-radius: 22px; }
      h1 { font-family: Literata, Georgia, serif; font-size: 26px; line-height: 32px; font-weight: 600; margin: .25rem 0 0; }
      p { margin: 0; max-width: 22rem; font-size: 16px; line-height: 24px; color: var(--ink-soft); }
      button {
        margin-top: .5rem; border: 0; border-radius: 16px; height: 48px; padding: 0 18px;
        background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="GNW Hub" />
    <h1>You're offline</h1>
    <p>GNW Hub needs a connection to load this page. Check your signal and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
